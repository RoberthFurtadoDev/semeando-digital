server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:mem:semeando;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=true
spring.h2.console.enabled=${H2_CONSOLE:true}
spring.jackson.serialization.write-dates-as-timestamps=false

# Login com Google (opcional). Sem o Client ID o botão do Google não aparece.
app.google.client-id=${GOOGLE_CLIENT_ID:}
# E-mails Google que entram como Gestor no primeiro acesso (separados por vírgula)
app.google.gestores=${GOOGLE_GESTOR_EMAILS:}
